name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-basic:
    name: Basic E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run user flow tests
        run: npx playwright test user-flow

      - name: Run PWA tests
        run: npx playwright test pwa

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-basic
          path: playwright-report/
          retention-days: 7

  # Lead-capture tests hit a real Supabase project with the service role
  # key, which bypasses RLS. Running this job on PRs would give anyone who
  # can open a PR (collaborators, or anyone touching the workflow file)
  # an opportunity to exfiltrate the secret via a crafted step. We restrict
  # it to `push: main` (post-merge validation) until a dedicated staging
  # project with a scoped service role exists.
  test-lead-capture:
    name: Lead Capture Tests (post-merge)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: dummy-key-for-tests
      PLACA_API_TOKEN: dummy-token-for-tests
      API_KEY_OPENAI: dummy-openai-key

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env.test file
        run: |
          echo "PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}" >> .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.test

      - name: Debug Supabase reachability (temporario)
        run: |
          echo "host hash: $(echo -n "${{ secrets.PUBLIC_SUPABASE_URL }}" | md5sum | head -c 8)"
          KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          URL="${{ secrets.PUBLIC_SUPABASE_URL }}"
          echo "select consultas: HTTP $(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/consultas?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")"
          BODY='{"email":"test+ci-debug@placacompleta.com.br","placa":"DBG0001","ip_address":"unknown","geo_city":null,"geo_uf":null,"geo_country":null,"geo_region_code":null,"is_pwa":false,"channel":"email","email_sent":false,"whatsapp_sent":false,"user_agent":"ci-debug"}'
          RESP=$(curl -s -w '\nHTTP %{http_code}' -X POST "$URL/rest/v1/consultas" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -H "Prefer: return=minimal" -d "$BODY")
          echo "insert com colunas geo: $RESP"
          curl -s -o /dev/null -w 'delete debug: HTTP %{http_code}\n' -X DELETE "$URL/rest/v1/consultas?email=eq.test%2Bci-debug@placacompleta.com.br" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"

      - name: Run lead capture tests
        run: npm run test:leads

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-leads
          path: playwright-report/
          retention-days: 7
