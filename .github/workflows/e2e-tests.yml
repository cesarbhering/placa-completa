name: E2E Tests

# Phase-out: os testes E2E nao rodam mais automaticamente em PR/push.
# Ficam disponiveis apenas por acionamento manual (workflow_dispatch) e o
# codigo dos testes (tests/, playwright.config.ts, vitest.config.ts)
# permanece versionado como memoria/referencia.
on:
  workflow_dispatch:

jobs:
  test-basic:
    name: Basic E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run user flow tests
        run: npx playwright test user-flow

      - name: Run PWA tests
        run: npx playwright test pwa

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-basic
          path: playwright-report/
          retention-days: 7

  # Lead-capture tests hit a real Supabase project with the service role
  # key, which bypasses RLS. Nunca rodam em PR para evitar exfiltracao do
  # secret via step malicioso; agora so por acionamento manual
  # (workflow_dispatch), que exige permissao de escrita no repo.
  test-lead-capture:
    name: Lead Capture Tests (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: dummy-key-for-tests
      PLACA_API_TOKEN: dummy-token-for-tests
      API_KEY_OPENAI: dummy-openai-key

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create .env.test file
        run: |
          echo "PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}" >> .env.test
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.test

      - name: Run lead capture tests
        run: npm run test:leads

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-leads
          path: playwright-report/
          retention-days: 7
