[build]
  command = "npx tsx scripts/fetch-fipe-prices.ts && timeout 180 npm run build || test $? -eq 124"
  publish = "dist"

[[redirects]]
  from = "https://dashboard.placacompleta.com.br"
  to = "https://placacompleta.com.br/dash"
  status = 301
  force = true

[[redirects]]
  from = "https://dashboard.placacompleta.com.br/"
  to = "https://placacompleta.com.br/dash"
  status = 301
  force = true

[[redirects]]
  from = "https://www.placacompleta.com.br/*"
  to = "https://placacompleta.com.br/:splat"
  status = 301
  force = true
