[build]
  command = "npx tsx scripts/fetch-fipe-prices.ts && npm run build"
  publish = "dist"

[functions]
  directory = ".netlify/functions-internal"
  node_bundler = "esbuild"

[[redirects]]
  from = "https://dashboard.placacompleta.com.br"
  to = "https://placacompleta.com.br/dash"
  status = 301
  force = true

[[redirects]]
  from = "https://dashboard.placacompleta.com.br/"
  to = "https://placacompleta.com.br/dash"
  status = 301
  force = true

[[redirects]]
  from = "https://www.placacompleta.com.br/*"
  to = "https://placacompleta.com.br/:splat"
  status = 301
  force = true
