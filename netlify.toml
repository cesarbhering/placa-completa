[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://dashboard.placacompleta.com.br"
  to = "https://placacompleta.com.br/dash"
  status = 301
  force = true

[[redirects]]
  from = "https://dashboard.placacompleta.com.br/"
  to = "https://placacompleta.com.br/dash"
  status = 301
  force = true

[[redirects]]
  from = "https://www.placacompleta.com.br/*"
  to = "https://placacompleta.com.br/:splat"
  status = 301
  force = true
