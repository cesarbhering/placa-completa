<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: 'Manrope', system-ui, sans-serif;
    background: radial-gradient(120% 120% at 50% 0%, #04225c 0%, #001233 55%, #000a1f 100%);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 34px;
  }
  .marca { display: flex; align-items: center; gap: 20px; }
  .marca__icone { width: 132px; height: 84px; position: relative; }
  .marca__icone i {
    position: absolute; width: 26px; height: 26px; border: 5px solid #fff;
  }
  .marca__icone i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .marca__icone i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .marca__icone i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .marca__icone i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
  .marca__placa {
    position: absolute; inset: 18px 16px; background: #fff; border-radius: 4px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .marca__placa::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 13px;
    background: #00e07a; border-radius: 4px 0 0 4px;
  }
  .marca__placa span { width: 9px; height: 9px; border-radius: 50%; background: #001233; }
  .marca__nome { font-size: 44px; font-weight: 800; line-height: 0.98; letter-spacing: -0.01em; }
  .marca__nome small { display: block; font-size: 44px; font-weight: 400; }
  h1 { font-size: 60px; font-weight: 800; letter-spacing: -0.02em; text-align: center; line-height: 1.08; }
  h1 b { color: #3d8bff; font-weight: 800; }
  .placa {
    background: #fff; border-radius: 10px; overflow: hidden; width: 380px;
  }
  .placa__topo {
    background: #1f6feb; color: #fff; font-size: 19px; font-weight: 700;
    letter-spacing: 0.34em; text-align: center; padding: 7px 0 6px;
  }
  .placa__num {
    color: #001233; font-size: 62px; font-weight: 800; letter-spacing: 0.14em;
    text-align: center; padding: 14px 0 20px;
  }
  .itens { display: flex; gap: 14px; }
  .itens span {
    font-size: 21px; color: #cfe0ff; border: 1px solid rgba(255,255,255,0.28);
    border-radius: 999px; padding: 9px 20px;
  }
</style></head>
<body>
  <div class="marca">
    <div class="marca__icone">
      <i></i><i></i><i></i><i></i>
      <div class="marca__placa"><span></span><span></span><span></span></div>
    </div>
    <div class="marca__nome">PLACA<small>COMPLETA</small></div>
  </div>
  <h1>O anúncio mostra o carro.<br><b>O relatório mostra o resto.</b></h1>
  <div class="placa">
    <div class="placa__topo">BRASIL</div>
    <div class="placa__num">ABC1D23</div>
  </div>
  <div class="itens">
    <span>Restrição</span><span>Roubo e furto</span><span>Gravame</span><span>Registro de leilão</span><span>FIPE</span>
  </div>
</body></html>
